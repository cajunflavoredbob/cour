<svg width="512" height="512" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cour">
  <!-- "Dotted answer" (design addendum APP_MARK.md): the c asks, the four
       seasons answer. Dual-surface variant: transparent, with a
       translucent warm-dark contour behind the ivory so the mark holds
       on light AND dark browser chrome. The opaque tile lives on in the
       PNG app icons (PWA / apple-touch / maskable), where app-icon duty
       requires a background. -->
